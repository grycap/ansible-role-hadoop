---
- name: Apt update_cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: "ansible_os_family == 'Debian'" 

- name: Apt install java
  apt:
    name: "{{ hadoop_java_package_debian }}"
    state: present
  when: "ansible_os_family == 'Debian'"

# RedHat related OSs
- name: Yum install java
  package:
    name: "{{ hadoop_java_package_redhat }}"
    state: present
  when: "ansible_os_family == 'RedHat'"

- name: Install requisites
  package: 
    name:
      - wget
      - tar
      - gzip
      - unzip
    state: present

- set_fact:
    hadoop_files: '{{ lookup("url", "http://apache.rediris.es/hadoop/core/stable/", split_lines=False) | regex_findall("hadoop-(\d+\.\d+\.\d+)\.tar") }}'
  when: hadoop_version == 'latest'
- set_fact:
    hadoop_version: "{{ hadoop_files | sort | last }}"
  when: hadoop_version == 'latest'

- set_fact:
    hadoop_file_ext: 'tar.gz'

- name: "Download {{ hadoop_version }}"
  get_url: url={{ hadoop_mirrors|random }}/hadoop-{{ hadoop_version }}.{{ hadoop_file_ext }} dest=/opt/hadoop-{{ hadoop_version }}.{{ hadoop_file_ext }} force=no
  register: result
  until: result is success
  retries: 5
  delay: 2

- name: "Download {{ hadoop_version }} from archive as fallback for old versions"
  get_url: url=https://archive.apache.org/dist/hadoop/core/hadoop-{{ hadoop_version }}/hadoop-{{ hadoop_version }}.{{ hadoop_file_ext }} dest=/opt/hadoop-{{ hadoop_version }}.{{ hadoop_file_ext }} force=no
  register: fallback_result
  until: fallback_result is success
  retries: 2
  delay: 2
  when: result is failed

- name: Unarchive hadoop tgz
  unarchive: src=/opt/hadoop-{{ hadoop_version }}.{{ hadoop_file_ext }} dest=/opt creates=/opt/hadoop-{{ hadoop_version }} copy=no

- name: "Create {{ hadoop_home }} dir"
  file: dest={{ hadoop_home }} src=/opt/hadoop-{{ hadoop_version }} state=link

- name: "Create /opt/hadoop dir"
  file: dest=/opt/hadoop src={{ hadoop_home }} state=link

- name: Find installed Java home
  shell: dirname "$(dirname "$(readlink -f "$(command -v java)")")"
  args:
    executable: /bin/sh
  register: hadoop_java_home
  changed_when: false

- name: Set JAVA_HOME in hadoop-env.sh
  lineinfile:
    path: "{{ hadoop_home }}/etc/hadoop/hadoop-env.sh"
    regexp: '^export JAVA_HOME='
    line: "export JAVA_HOME={{ hadoop_java_home.stdout }}"
